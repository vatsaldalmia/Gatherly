name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-deploy from the Actions tab

# Never let two deploys race; a queued one supersedes an older running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # wrangler is run by Node, never Bun: under Bun its upload step exits 0 without
      # deploying, which would turn a broken deploy into a green checkmark. See DEPLOY.md.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # VITE_* are build-time: they bake into the browser bundle, so they must be present
      # here, not as Worker secrets. VITE_APP_URL must equal the live origin or the
      # better-auth browser client will point at the wrong host.
      - name: Build
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APP_URL: https://gatherly.usegatherly.workers.dev

      # Runtime secrets (BETTER_AUTH_SECRET, BETTER_AUTH_URL, GOOGLE_MAPS_API_KEY) already
      # live on the Worker; `wrangler deploy` preserves them and they are not needed here.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm

      - name: Smoke test the live deploy
        run: |
          set -euo pipefail
          url="https://gatherly.usegatherly.workers.dev"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/") || code=000
            if [ "$code" = "200" ]; then
              echo "✓ $url returned 200"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "✘ deploy is live but $url never returned 200 (last: HTTP $code)"
          exit 1
