name: CI

# Runs the checks that a merge to main would otherwise discover for the first time
# *during* the deploy. Deploy (.github/workflows/deploy.yml) does: install --frozen-lockfile
# -> tsc --noEmit -> bun run build -> wrangler deploy. Every step below mirrors one of those,
# so a green PR means the post-merge deploy cannot fail on a lockfile, a type error, or a
# build error. Keep the two files in step: a check added to deploy belongs here too.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you re-run the checks by hand from the Actions tab

# A new push to a PR makes the in-flight run pointless — drop it and check the new head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Wrangler is Node-only (see DEPLOY.md); the bundle check below shells out to it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --frozen-lockfile is the point: a PR that edits package.json without committing
      # bun.lock fails here rather than at deploy time.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # VITE_* are build-time — they bake into the browser bundle. The Maps key is absent
      # on forked-PR runs, and that is fine: the map components fall back to a placeholder
      # and the build still succeeds. VITE_APP_URL matches deploy.yml so the bundle CI
      # verifies is the bundle main will ship.
      - name: Build
        run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APP_URL: https://gatherly.usegatherly.workers.dev

      # The build can succeed and still produce nothing deployable: without the explicit
      # nitro block in vite.config.ts, Vite emits a client bundle and no Worker at all,
      # and `wrangler deploy` would then ship a broken app with a green checkmark. Assert
      # the Worker entry, the pinned name, and the D1 binding all survived the build.
      - name: Verify the Worker bundle
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs \
            || { echo "✘ no Worker emitted — is the nitro block still in vite.config.ts?"; exit 1; }
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const c = JSON.parse(await readFile(".output/server/wrangler.json", "utf8"));
            const problems = [];
            if (c.name !== "gatherly") problems.push(`name is "${c.name}", expected "gatherly"`);
            if (!c.d1_databases?.some((d) => d.binding === "DB")) problems.push("D1 binding DB is missing");
            if (problems.length) { console.error("✘ " + problems.join("; ")); process.exit(1); }
            console.log(`✓ Worker "${c.name}" with D1 binding DB`);
          '

      # Advisory only. The tree currently has ~2900 outstanding prettier violations, so
      # gating on this would block every PR for reasons unrelated to the PR. It reports
      # into the log; flip to a blocking step once `bun run format` has been run on main.
      - name: Lint
        continue-on-error: true
        run: bun run lint
